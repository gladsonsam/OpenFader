[package]
name = "openmix-serve"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "openmix-serve"
path = "src/main.rs"

[lib]
name = "openmix_serve"
path = "src/lib.rs"

[dependencies]
openmix-engine = { path = "../engine" }
openmix-sim = { path = "../sim" }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
hyper-util = { version = "0.1", features = ["tokio", "service", "server", "http1"] }
serde_json = "1"
futures = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures = "0.3"
socket2 = "0.5"
