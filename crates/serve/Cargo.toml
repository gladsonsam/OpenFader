[package]
name = "openfader-serve"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "openfader-serve"
path = "src/main.rs"

[lib]
name = "openfader_serve"
path = "src/lib.rs"

[dependencies]
openfader-engine = { path = "../engine" }
openfader-sim = { path = "../sim" }
openfader-audio = { path = "../audio" }
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hyper-util = { version = "0.1", features = ["tokio", "service", "server", "http1"] }
serde_json = "1"
futures = "0.3"
rcgen = "0.13"
sha2 = "0.11"
getrandom = "0.2"
subtle = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
futures = "0.3"
socket2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[lints]
workspace = true
