[package]
name = "openfader-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "openfader_engine"
path = "src/lib.rs"

[dependencies]
openfader-core = { path = "../core" }
openfader-sim = { path = "../sim" }
openfader-proto-xair = { path = "../proto-xair" }
openfader-proto-wing = { path = "../proto-wing" }
openfader-proto-dl32s = { path = "../proto-dl32s" }
openfader-transport = { path = "../transport" }
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
