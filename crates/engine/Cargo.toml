[package]
name = "openmix-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "openmix_engine"
path = "src/lib.rs"

[dependencies]
openmix-core = { path = "../core" }
openmix-sim = { path = "../sim" }
openmix-proto-xair = { path = "../proto-xair" }
openmix-proto-dl32s = { path = "../proto-dl32s" }
openmix-transport = { path = "../transport" }
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
