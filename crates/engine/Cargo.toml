[package]
name = "openfader-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "openfader_engine"
path = "src/lib.rs"

[dependencies]
openfader-core = { path = "../core" }
openfader-sim = { path = "../sim" }
openfader-proto-xair = { path = "../proto-xair" }
openfader-proto-x32 = { path = "../proto-x32" }
openfader-proto-wing = { path = "../proto-wing" }
openfader-proto-dl32s = { path = "../proto-dl32s" }
openfader-transport = { path = "../transport" }
anyhow = "1"
getrandom = "0.3"
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
# Destination preset guards compare complete JSON descriptors exactly. Preserve
# f32-derived f64 numbers (e.g. the 115.8 m delay bound) on the Dart roundtrip.
serde_json = { version = "1", features = ["float_roundtrip"] }
base64 = "0.23"

[lints]
workspace = true
