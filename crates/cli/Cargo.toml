[package]
name = "openfader-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "openfader-cli"
path = "src/main.rs"

[dependencies]
openfader-core = { path = "../core" }
openfader-engine = { path = "../engine" }
openfader-sim = { path = "../sim" }
anyhow = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
openfader-core = { path = "../core" }
openfader-sim = { path = "../sim" }
