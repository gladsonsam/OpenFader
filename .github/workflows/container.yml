name: Verify Docker server

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Build the shared server and Flutter web app
        run: docker build --progress=plain --tag openfader-container-check .
      - name: Verify shared UI, client authentication, ports and persistence
        run: python3 scripts/check-container.py openfader-container-check
