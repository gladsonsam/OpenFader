name: Release checks (manual)

# Run explicitly before a release; ordinary pushes and PRs do not trigger CI.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/sync-version.mjs --check

  rust:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev
      - run: cargo check --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  flutter:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          # Pinned Flutter SDK (Flutter 3.47.7, release tag: commit
          # hashes are not resolvable by the setup action).
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: app
      - run: flutter analyze --no-pub
        working-directory: app
      - run: flutter build web --release --no-pub --no-web-resources-cdn
        working-directory: app

  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Provision pinned ASIO SDK and libclang
        shell: pwsh
        run: ./scripts/provision-windows-ci.ps1
      - run: cargo check --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: flutter pub get --enforce-lockfile
        working-directory: app
      - run: ./scripts/build-windows.ps1
        shell: pwsh
      - name: Verify packaged host and bridge
        shell: pwsh
        run: |
          $bundle = 'app/build/windows/x64/runner/Release'
          foreach ($file in @('openfader-serve.exe', 'openfader-capture-helper.exe', 'openfader_flutter_bridge.dll', 'web/flutter_bootstrap.js')) {
            if (-not (Test-Path (Join-Path $bundle $file))) { throw "Missing $file in $bundle" }
          }
      - name: Smoke-check packaged ASIO helper
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'audio-devices.json'
          $stderr = Join-Path $env:RUNNER_TEMP 'audio-devices.log'
          $helper = Start-Process -FilePath 'app/build/windows/x64/runner/Release/openfader-capture-helper.exe' -ArgumentList '--list-devices' -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            if (-not $helper.WaitForExit(15000)) { throw 'ASIO helper scan timed out' }
            if ($helper.ExitCode -ne 0) { throw "ASIO helper failed: $(Get-Content $stderr -Raw)" }
            $response = Get-Content $stdout -Raw | ConvertFrom-Json
            if ($response.state -ne 'DEVICES' -or $null -eq $response.devices) { throw 'Invalid ASIO device scan response' }
            # Hosted runners need no audio hardware; a successful empty scan is valid.
          } finally {
            if (-not $helper.HasExited) { $helper.Kill(); $helper.WaitForExit() }
            $helper.Dispose()
          }
