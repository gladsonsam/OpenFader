name: Build and release apps
run-name: Build ${{ inputs.platform }} apps · ${{ github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build
        type: choice
        default: all
        options: [all, windows-android, ios, macos, linux, windows, android]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }} bundles
    runs-on: ${{ fromJSON('{"ios":"macos-15","macos":"macos-15","linux":"ubuntu-22.04","windows":"windows-2022","android":"ubuntu-22.04"}')[matrix.platform] }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ github.event_name == 'push' && fromJSON('["windows","android"]') || inputs.platform == 'windows-android' && fromJSON('["windows","android"]') || inputs.platform == 'all' && fromJSON('["ios","macos","linux","windows","android"]') || fromJSON(format('["{0}"]', inputs.platform)) }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate release tag
        if: github.event_name == 'push'
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(tr -d '\r\n' < VERSION)"
      - name: Provision Windows native dependencies
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/provision-windows-ci.ps1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          # Pinned Flutter SDK (Flutter 3.47.7, release tag: commit
          # hashes are not resolvable by the setup action).
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: apps-${{ matrix.platform }}
      - name: Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Apple Rust targets
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-darwin x86_64-apple-darwin
      - uses: actions/setup-java@v6
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        if: matrix.platform == 'android'
      - name: Android native toolchain
        if: matrix.platform == 'android'
        shell: bash
        run: |
          sdkmanager 'platforms;android-37' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Restore Android development signer
        if: matrix.platform == 'android'
        env:
          OPENFADER_ANDROID_DEV_KEYSTORE_BASE64: ${{ secrets.OPENFADER_ANDROID_DEV_KEYSTORE_BASE64 }}
        run: python scripts/restore-android-development-signer.py
      - name: Build and package native app
        # The script embeds a fresh engine in every platform bundle.
        shell: bash
        env:
          OPENFADER_BUILD_NUMBER: ${{ github.run_number }}
          OPENFADER_PLATFORM: ${{ matrix.platform }}
        run: python scripts/ci-build-app.py "$OPENFADER_PLATFORM"
      - uses: actions/upload-artifact@v7
        with:
          name: openfader-${{ matrix.platform }}-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Artifact summary
        shell: bash
        run: |
          echo '### ${{ matrix.platform }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the bundles from this run’s Artifacts section. Checksums and build metadata are included.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Apple device bundles are unsigned; Android release builds use a development key. These are not store submissions.' >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: openfader-*
          path: release-assets
          merge-multiple: true
      - name: Check tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v$(tr -d '\r\n' < VERSION)"
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          version="${GITHUB_REF_NAME#v}"
          test -s "release-assets/OpenFader-${version}-windows-x64-setup.exe"
          test -s "release-assets/OpenFader-${version}-android.apk"
          gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --title "OpenFader $version" --notes "XR18 hardware tested. Mackie VSC is unavailable pending USB proof. The Windows installer is unsigned. The Android APK uses the persistent development signing key and is not signed for Play Store distribution."
