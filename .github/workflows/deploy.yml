name: Build and release apps
run-name: Build ${{ inputs.platform }} apps · ${{ github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build
        type: choice
        default: all
        options: [all, windows-android, linux, windows, android]

      upload-artifacts:
        description: Store manual-build downloads (requires available Actions artifact quota)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      skip-windows: true

  prepare:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Prepare draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v$(tr -d '\r\n' < VERSION)"
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > /tmp/release-draft; then
            test "$(cat /tmp/release-draft)" = true
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "OpenFader ${GITHUB_REF_NAME#v}" --notes "The Windows installer is unsigned. The Android APK uses the persistent development signing key and is not signed for Play Store distribution."
          fi

  build:
    needs: prepare
    permissions:
      contents: write
    name: ${{ matrix.platform }} bundles
    runs-on: ${{ fromJSON('{"linux":"ubuntu-22.04","windows":"windows-2022","android":"ubuntu-22.04"}')[matrix.platform] }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ github.event_name == 'push' && fromJSON('["windows","android","linux"]') || inputs.platform == 'windows-android' && fromJSON('["windows","android"]') || inputs.platform == 'all' && fromJSON('["windows","android","linux"]') || fromJSON(format('["{0}"]', inputs.platform)) }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate release tag
        if: github.event_name == 'push'
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(tr -d '\r\n' < VERSION)"
      - name: Provision Windows native dependencies
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/provision-windows-ci.ps1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          # Pinned Flutter SDK (Flutter 3.50.0, release tag: commit
          # hashes are not resolvable by the setup action).
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: apps-${{ matrix.platform }}
      - name: Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libx11-dev libxi-dev libasound2-dev
      - name: Install pinned AppImage packaging tool
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/linuxdeploy.AppImage"
          curl --fail --location --retry 3 --output "$tool" https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  $tool" | sha256sum -c -
          chmod +x "$tool"
          echo "LINUXDEPLOY=$tool" >> "$GITHUB_ENV"
          echo 'APPIMAGE_EXTRACT_AND_RUN=1' >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        if: matrix.platform == 'android'
      - name: Android native toolchain
        if: matrix.platform == 'android'
        shell: bash
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Restore Android development signer
        if: matrix.platform == 'android'
        env:
          OPENFADER_ANDROID_DEV_KEYSTORE_BASE64: ${{ secrets.OPENFADER_ANDROID_DEV_KEYSTORE_BASE64 }}
        run: python scripts/restore-android-development-signer.py
      - name: Build and package native app
        # The script embeds a fresh engine in every platform bundle.
        shell: bash
        env:
          OPENFADER_BUILD_NUMBER: ${{ github.run_number }}
          OPENFADER_PLATFORM: ${{ matrix.platform }}
        run: python scripts/ci-build-app.py "$OPENFADER_PLATFORM" --release-only
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch' && inputs.upload-artifacts
        with:
          name: openfader-${{ matrix.platform }}-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Upload draft release assets
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
          gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
      - name: Artifact summary
        shell: bash
        run: |
          echo '### ${{ matrix.platform }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Tagged bundles go directly to the release. Manual downloads are available when artifact upload is enabled. Checksums and build metadata are included.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Release downloads: Windows EXE, Android APK, Linux AppImage. Checksums and build metadata support verification.' >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: github.event_name == 'push'
    needs: [checks, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v$(tr -d '\r\n' < VERSION)"
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
          gh release download "$GITHUB_REF_NAME" --dir release-assets
          (cd release-assets && sed 's/\r$//' windows-SHA256SUMS android-SHA256SUMS linux-SHA256SUMS | sha256sum -c -)
          python3 -c 'import json,os; from pathlib import Path; assert all(json.loads(Path("release-assets", f"{p}-build.json").read_text())["commit"] == os.environ["EXPECTED_SHA"] for p in ("windows", "android", "linux")), "asset commit mismatch"'
          version="${GITHUB_REF_NAME#v}"
          test -s "release-assets/OpenFader-${version}-windows-x64-setup.exe"
          test -s "release-assets/OpenFader-${version}-android.apk"
          test -s "release-assets/OpenFader-${version}-linux-x64.AppImage"
          gh release edit "$GITHUB_REF_NAME" --draft=false
