<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="description" content="openmix — gig-friendly mixer remote. Install to the home screen, point at openmix-serve, mix." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="openmix" />
    <style>
      /* First-paint background: the WebView surface is white until CSS/JS
         load — paint it the app's dark surface inline so launch is never
         white, matching the branded LaunchScreen pixel-for-pixel. */
      html, body { margin: 0; padding: 0; background: #0b0e14; height: 100%; }
      #app { min-height: 100dvh; background: #0b0e14; }
      .bootstatic { min-height: 100dvh; box-sizing: border-box; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: #0b0e14; text-align: center; }
      .bootstatic-word { margin: 0; color: #fff; font: 700 40px/1 -apple-system, system-ui, sans-serif; }
      .bootstatic-spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255,255,255,.18); border-top-color: #fff; animation: bootstaticspin .9s linear infinite; }
      .bootstatic-msg { max-width: 340px; color: #e1e7ef; font: 15px/1.5 -apple-system, system-ui, sans-serif; }
      .bootstatic-msg p { margin: 0; }
      .bootstatic-detail { margin-top: 8px !important; color: #a5b0c0; font-size: 13px; }
      .bootstatic-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; }
      .bootstatic-actions:empty { display: none; }
      .bootstatic-actions button { min-height: 44px; padding: 10px 18px; border: 1px solid #64748b; border-radius: 6px; background: #182230; color: #fff; font: 600 14px/1.4 -apple-system, system-ui, sans-serif; cursor: pointer; }
      .bootstatic-actions button:focus-visible { outline: 3px solid #5fe3f0; outline-offset: 3px; }
      @keyframes bootstaticspin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .bootstatic-spin { animation: none; } }
    </style>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>openmix</title>
  </head>
  <body>
    <div id="app">
      <!-- Remains visible while the local UI loads, before Svelte mounts. -->
      <main class="bootstatic" aria-label="openmix startup">
        <h1 class="bootstatic-word">openmix</h1>
        <div class="bootstatic-spin" aria-hidden="true"></div>
        <div class="bootstatic-msg" role="status">Preparing your workspace</div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
