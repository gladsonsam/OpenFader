name: app
description: Control your mixer from any device
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  crypto: ^3.0.0
  ffi: ^2.1.0
  flutter_rust_bridge: ^2.13.0
  web_socket_channel: ^3.0.0
  permission_handler: ^13.0.2
  flutter_svg: ^2.3.2
  vector_graphics: ^1.2.4
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  path: ^1.9.1
  share_plus: ^13.3.1
  file_picker: ^13.1.0
  wakelock_plus: ^1.8.2
  url_launcher: ^6.3.3
  window_manager: 0.5.1
  tray_manager: 0.8.3
  screen_retriever: 0.2.0
  dbus: 0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/mixer/
    - assets/brand/open-fader-logo.svg
    - assets/brand/open-fader-logo-32.png
    - assets/brand/open-fader-tray.ico
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
          weight: 400
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700

    - family: Barlow Condensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
