[package]
name = "openmix-app"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
tauri-plugin-os = "2"
tauri-plugin-store = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-haptics = "2"
tauri-plugin-keep-screen-on = "0.1"
openmix-engine = { path = "../crates/engine" }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "openmix_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[patch.crates-io]
# Vendored 2026-10-19: published 0.1.4 android/build.gradle.kts uses the old
# AGP DSL (targetSdk/kotlinOptions) which AGP 9 rejects. Local registry was
# hand-patched before; this makes the fix committed and reproducible (CI +
# fresh machines). Drop when upstream ships fixed packaging.
tauri-plugin-keep-screen-on = { path = "vendor/tauri-plugin-keep-screen-on" }
