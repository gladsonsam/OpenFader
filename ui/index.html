<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>openmix</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar">
  <span id="logo">openmix</span>
  <label>driver
    <select id="driver">
      <option value="sim">sim</option>
      <option value="xair">xair</option>
      <option value="dl32s">dl32s</option>
    </select>
  </label>
  <label>addr <input id="addr" inputmode="numeric" placeholder="192.168.1.10 (blank = sim)" size="22"></label>
  <button id="conn" class="big">connect</button>
  <span id="badge" class="offline">offline</span>
  <span id="via" title="transport"></span>
  <button id="bridgeBtn" title="toggle meter bridge">bridge</button>
</header>

<nav id="layers" role="tablist">
  <button data-layer="inputs" class="on" role="tab">Inputs</button>
  <button data-layer="buses" role="tab">Buses</button>
  <button data-layer="mains" role="tab">Mains</button>
</nav>

<canvas id="bridge" hidden></canvas>

<div id="scenes">
  <span class="lbl">scenes</span>
  <div id="slots"></div>
  <button id="store">store</button>
  <span id="status" role="status"></span>
</div>

<main id="wrap">
  <div id="strips"></div>
  <aside id="detail" aria-label="channel detail"></aside>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
